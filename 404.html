<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — SunSwipe</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #FBF5EC; --ink: #211D17; --muted: #767064;
    --coral: #EA5B2F; --coral-btn: #C64D27;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 40px; }
  .logo span { color: var(--coral); }
  .code { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 100px; line-height: 1; color: var(--coral); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin: 16px 0 12px; }
  p { color: var(--muted); font-size: 15.5px; max-width: 380px; line-height: 1.6; margin-bottom: 32px; }
  a.btn { background: var(--coral-btn); color: #fff; padding: 14px 28px; border-radius: 999px; font-weight: 700; font-size: 15px; text-decoration: none; }
</style>
</head>
<body>
  <div class="logo">Sun<span>Swipe</span></div>
  <div class="code">404</div>
  <h1>Cette page a swipé ailleurs.</h1>
  <p>La page que tu cherches n'existe pas ou plus. Retourne à l'accueil pour découvrir SunSwipe.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</body>
</html>
